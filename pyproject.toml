[project]
name = "claude-pii-guard"
version = "0.1.0"
description = "Keep raw personal data out of the Anthropic API while keeping Claude Code's Auto mode hands-off: safe-data MCP server, DB views, ETL, settings, skills."
requires-python = ">=3.12"
dependencies = [
    "faker>=30",
    "mcp>=2.3",
    "psycopg[binary]>=3.1",
    "pydantic>=2",
]

[project.scripts]
safe-data-mcp = "safe_data.server:main"
safeify-csv = "safe_data.etl:main"

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
