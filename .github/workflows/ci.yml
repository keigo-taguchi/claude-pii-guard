name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -q

  mod:
    # Mods are an early-access API: run the mod's tests against the current
    # Claude Code release so a breaking change shows up here, not in a session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate ./mods/pii-guard
      - run: cd mods/pii-guard && claude plugin test
